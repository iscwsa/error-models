# A pushed release tag must name a tree cut for that release (docs/releasing.md). Nothing is published.
name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python -m tools.release check --tag "${{ github.ref_name }}"
